# Release builds: a Linux AppImage, a Windows zip (tt2.exe + DLLs +
# data/) and an Android APK signed with the release key. Runs on pushes to
# main, on version tags (v*), and by hand; a v* tag also publishes all
# three as a GitHub Release.
# The packages carry only the open-license dictionaries and the
# procedural placeholder art; GameHouse assets are never part of a build.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # A tag names the package after itself; any other run uses the short SHA.
  PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  appimage:
    name: Linux AppImage
    # The oldest supported runner: an AppImage only runs on glibc versions
    # at least as new as the one it was built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # SDL3 is built from the pinned releases (TT2_FETCH_SDL3); these are
      # the headers for its video and audio backends.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Build and install into AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DTT2_BUILD_TESTS=OFF -DTT2_FETCH_SDL3=ON
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build
          # The AppImage runtime (the stub in front of the squashfs) is MIT,
          # with musl, libfuse, squashfuse, zstd and zlib linked in.
          install -Dm644 packaging/linux/appimage-runtime-LICENSE.txt \
            AppDir/usr/share/licenses/tt2/appimage-runtime.txt

      - name: Bundle with linuxdeploy
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runners have no FUSE
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          LINUXDEPLOY_OUTPUT_VERSION="${PACKAGE_VERSION:0:12}" ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/tt2 \
            --desktop-file AppDir/usr/share/applications/tt2.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/tt2.svg \
            --output appimage
          # SDL loads the GPU drivers at run time; they must come from the
          # player's system, never from the AppImage.
          if ls AppDir/usr/lib | grep -E '^lib(vulkan|GL|EGL|GLX)\.so'; then exit 1; fi

      - name: Smoke run the AppImage (headless)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: >
          ./Re-Twist_TT2-*-x86_64.AppImage --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/assets"
          --player CI --seed 5 --play untimed --type '~ab|' --exit-after 9000

      # Decode real files with the game's own loaders: a package that lost
      # a decoder (the first SDL3 Windows zip showed a black splash) fails
      # here, since the synthetic import never decodes anything.
      - name: Media decoders
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          app=$(ls "$PWD"/Re-Twist_TT2-*-x86_64.AppImage)
          "$app" --probe-media ui/tests/media/probe.jpg --probe-media ui/tests/media/probe.png \
            --probe-media ui/tests/media/probe.ogg
          if "$app" --probe-media ui/tests/media/broken.png; then exit 1; fi   # a corrupt file must fail

      # The packaged game must find its bundled manifest (or it could never
      # verify an import) and run the whole import on a synthetic install.
      - name: Asset import smoke (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          test -f AppDir/usr/share/tt2/data/original-assets.sha256
          test -f AppDir/usr/share/tt2/data/placeholder/fonts/font_settingstext.xml
          test -f AppDir/usr/share/tt2/data/placeholder/2x/fonts/font_settingstext.png   # 2x art (UX-8)
          for f in re-twist-tt2 super-xbr tinyfiledialogs SDL3 SDL3_image SDL3_mixer appimage-runtime; do
            test -f "AppDir/usr/share/licenses/tt2/$f.txt"
          done
          app=$(ls "$PWD"/Re-Twist_TT2-*-x86_64.AppImage)
          "$app" --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/empty-assets" --player CI \
            --type '~' --exit-after 8000 > bundled.log
          cat bundled.log
          grep -q 'import needed' bundled.log            # the bundled manifest loaded
          if grep -q 'no valid asset manifest' bundled.log; then exit 1; fi   # (! cmd never fails under bash -e)
          scripts/ci-import-smoke.sh "$app" ./build/tt2-assets "$RUNNER_TEMP/import-smoke"
          test ! -e "$HOME/.local/share/re-twist-tt2/imported-assets"

      - uses: actions/upload-artifact@v6
        with:
          name: re-twist-tt2-linux-x86_64-appimage
          path: Re-Twist_TT2-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build and install into dist/
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist" -DTT2_BUILD_TESTS=OFF -DTT2_FETCH_SDL3=ON
          cmake --build build
          cmake --install build
          cp LICENSE dist/

      - name: Copy the runtime DLLs next to tt2.exe
        run: |
          # Every DLL the game links that comes from the MSYS2 prefix (the GCC
          # runtime; SDL3 and its decoders are linked in statically).
          for exe in dist/tt2.exe dist/tt2_engine.exe; do
            ldd "$exe" | awk '/\/ucrt64\// {print $3}'
          done | sort -u | xargs -r cp -t dist/
          ls dist
          # Their notices: libwinpthread is MIT and BSD (binaries must carry
          # them); libstdc++ and libgcc are GPL 3 with the GCC Runtime Library
          # Exception, whose text MSYS2's gcc package ships.
          cp /ucrt64/share/licenses/libwinpthread/COPYING dist/licenses/libwinpthread.txt
          cp /ucrt64/share/licenses/gcc/COPYING.RUNTIME dist/licenses/gcc-runtime-exception.txt

      - name: Smoke run (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: >
          ./dist/tt2.exe --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/assets"
          --player CI --seed 5 --play untimed --type '~ab|' --exit-after 9000

      # Decode real files with the game's own loaders: a package that lost
      # a decoder (the first SDL3 Windows zip showed a black splash) fails
      # here, since the synthetic import never decodes anything.
      - name: Media decoders
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./dist/tt2.exe --probe-media ui/tests/media/probe.jpg --probe-media ui/tests/media/probe.png \
            --probe-media ui/tests/media/probe.ogg
          if ./dist/tt2.exe --probe-media ui/tests/media/broken.png; then exit 1; fi   # a corrupt file must fail

      - name: Asset import smoke (zip)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          test -f dist/data/original-assets.sha256
          test -f dist/data/placeholder/fonts/font_settingstext.xml
          test -f dist/data/placeholder/2x/fonts/font_settingstext.png   # 2x art (UX-8)
          for f in re-twist-tt2 super-xbr tinyfiledialogs SDL3 SDL3_image SDL3_mixer libwinpthread \
            gcc-runtime-exception; do
            test -f "dist/licenses/$f.txt"
          done
          ./dist/tt2.exe --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/empty-assets" --player CI \
            --type '~' --exit-after 8000 > bundled.log
          cat bundled.log
          grep -q 'import needed' bundled.log            # the bundled manifest loaded
          if grep -q 'no valid asset manifest' bundled.log; then exit 1; fi   # (! cmd never fails under bash -e)
          scripts/ci-import-smoke.sh ./dist/tt2.exe ./build/tt2-assets.exe "$RUNNER_TEMP/import-smoke"

      - uses: actions/upload-artifact@v6
        with:
          name: re-twist-tt2-windows-x86_64
          path: dist/
          if-no-files-found: error

  # The release APK, signed with the key from the repository's secrets
  # (TT2_KEYSTORE_BASE64, TT2_KEYSTORE_PASSWORD, TT2_KEY_ALIAS; set up as in
  # docs/android-signing.md). GitHub masks secret values in the log;
  # the decoded keystore lives in $RUNNER_TEMP for the build step only.
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: NDK and CMake
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          cmake=$(sed -n 's/^ *version = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" && test -n "$cmake"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Release APK
        working-directory: android
        env:
          TT2_KEYSTORE_BASE64: ${{ secrets.TT2_KEYSTORE_BASE64 }}
          TT2_KEYSTORE_PASSWORD: ${{ secrets.TT2_KEYSTORE_PASSWORD }}
          TT2_KEY_ALIAS: ${{ secrets.TT2_KEY_ALIAS }}
        run: |
          if [ -z "$TT2_KEYSTORE_BASE64" ] || [ -z "$TT2_KEYSTORE_PASSWORD" ] || [ -z "$TT2_KEY_ALIAS" ]; then
            echo "::error::The release keystore secrets are not set (TT2_KEYSTORE_BASE64, TT2_KEYSTORE_PASSWORD, TT2_KEY_ALIAS)."
            exit 1
          fi
          export TT2_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$TT2_KEYSTORE"' EXIT
          printf '%s' "$TT2_KEYSTORE_BASE64" | base64 -d > "$TT2_KEYSTORE"
          ./gradlew assembleRelease --console=plain

      # Signed (v2+ scheme, minSdk 31), not with a debug key, and with the
      # version CMakeLists.txt gives; on a tag that must be the tag's, less
      # any pre-release part (v0.6.0-beta.1 -> 0.6.0: CMake has no such part).
      - name: Signature and version
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "$tools/apksigner" verify --min-sdk-version 31 --print-certs "$apk" | tee signature.txt
          if grep -q 'CN=Android Debug' signature.txt; then echo "::error::signed with a debug key"; exit 1; fi
          version=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "versionName $version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
              echo "::error::versionName $version does not match the tag $GITHUB_REF_NAME"
              exit 1
            fi
            name=$GITHUB_REF_NAME
          else
            name=${GITHUB_SHA:0:12}
          fi
          mv "$apk" "re-twist-tt2-$name-android.apk"

      # Licences present, assets/ on the allow-list, and no file from the
      # original game under any name (the same check as CI's debug APK).
      - name: APK contents
        run: scripts/ci-apk-check.sh re-twist-tt2-*-android.apk data/original-assets.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: re-twist-tt2-android-apk
          path: re-twist-tt2-*-android.apk
          if-no-files-found: error

  # A version tag (v*) publishes every package as a GitHub Release. Only
  # this job may write to the repository; the tag itself is pushed by hand.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifacts/re-twist-tt2-windows-x86_64 &&
            zip -r "$GITHUB_WORKSPACE/re-twist-tt2-$GITHUB_REF_NAME-windows-x86_64.zip" .)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            artifacts/re-twist-tt2-linux-x86_64-appimage/*.AppImage \
            "re-twist-tt2-$GITHUB_REF_NAME-windows-x86_64.zip" \
            artifacts/re-twist-tt2-android-apk/*.apk
