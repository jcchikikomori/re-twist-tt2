# Unit tests on every push to main and every pull request.
#
# - Linux: GCC with warnings as errors, plus an AddressSanitizer /
#   UndefinedBehaviorSanitizer run of the tests (the engine stores
#   non-owning pointers, see CLAUDE.md "Engine ownership").
# - Windows: MSYS2 UCRT64 (MinGW-w64 GCC), the same toolchain the
#   Windows package uses; SDL3 is built from the pinned releases there
#   too (TT2_FETCH_SDL3), so every decoder is compiled in.
# Each job also smoke-runs the game headless when the UI was built.
# - Android: the Kotlin importer's unit tests, then the debug APK (NDK) and
#   a check of what it carries (scripts/ci-apk-check.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            ui: "ON"
            cxxflags: ""
          - name: asan-ubsan
            ui: "OFF"   # the tests are headless; skip SDL so the sanitizers only see our code
            cxxflags: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v6

      # Ubuntu 22.04 has no SDL3 packages: TT2_FETCH_SDL3 builds the pinned
      # releases, and these are the headers SDL needs for its video and
      # audio backends (it loads the libraries themselves at run time).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTT2_WARN_AS_ERROR=ON
          -DTT2_BUILD_UI=${{ matrix.ui }}
          -DTT2_FETCH_SDL3=${{ matrix.ui }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run (headless)
        if: matrix.ui == 'ON'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail   # a crash must not hide behind tee
          ./build/tt2 --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/assets" \
            --player CI --seed 5 --play untimed --type '~ab|' --exit-after 9000 | tee smoke.log
          # The dummy driver has no Vulkan or OpenGL: the renderer chain must
          # end at software, with the enhancements off (render_backend.hpp).
          grep -q '^renderer: software (.*); enhancements off' smoke.log

      # Decode real files with the game's own loaders: a package that lost
      # a decoder (the first SDL3 Windows zip showed a black splash) fails
      # here, since the synthetic import never decodes anything.
      - name: Media decoders
        if: matrix.ui == 'ON'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/tt2 --probe-media ui/tests/media/probe.jpg --probe-media ui/tests/media/probe.png \
            --probe-media ui/tests/media/probe.ogg
          if ./build/tt2 --probe-media ui/tests/media/broken.png; then exit 1; fi   # a corrupt file must fail

      # tt2 --import on a synthetic install (random bytes, decoy DRM names),
      # then proof that no run touched the real per-user asset folder.
      - name: Import smoke (synthetic install)
        if: matrix.ui == 'ON'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          scripts/ci-import-smoke.sh ./build/tt2 ./build/tt2-assets "$RUNNER_TEMP/import-smoke"
          test ! -e "$HOME/.local/share/re-twist-tt2/imported-assets"

  # The Android app. The importer's JVM tests need no NDK and no device;
  # the debug APK builds the repository's CMakeLists.txt with the NDK the
  # Gradle file pins. Like the import smoke above, every fixture is
  # synthetic bytes; real assets never come near CI.
  android:
    name: Android (unit tests, debug APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      # The versions come from build.gradle.kts, so a bump there can't
      # leave CI on the old ones. Quick when the runner already has them.
      - name: NDK and CMake
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          cmake=$(sed -n 's/^ *version = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" && test -n "$cmake"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      # Licences present, assets/ on the allow-list, and no file from the
      # original game under any name; then proof the check catches each.
      - name: APK contents
        run: |
          scripts/ci-apk-check.sh android/app/build/outputs/apk/debug/app-debug.apk data/original-assets.sha256
          scripts/ci-apk-check-test.sh android/app/build/outputs/apk/debug/app-debug.apk data/original-assets.sha256

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTT2_WARN_AS_ERROR=ON
          -DTT2_FETCH_SDL3=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: >
          ./build/tt2.exe --save-dir "$RUNNER_TEMP/save" --asset-dir "$RUNNER_TEMP/assets"
          --player CI --seed 5 --play untimed --type '~ab|' --exit-after 9000

      # Decode real files with the game's own loaders: a package that lost
      # a decoder (the first SDL3 Windows zip showed a black splash) fails
      # here, since the synthetic import never decodes anything.
      - name: Media decoders
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/tt2.exe --probe-media ui/tests/media/probe.jpg --probe-media ui/tests/media/probe.png \
            --probe-media ui/tests/media/probe.ogg
          if ./build/tt2.exe --probe-media ui/tests/media/broken.png; then exit 1; fi   # a corrupt file must fail

      - name: Import smoke (synthetic install)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: scripts/ci-import-smoke.sh ./build/tt2.exe ./build/tt2-assets.exe "$RUNNER_TEMP/import-smoke"
